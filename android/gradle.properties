org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# 旧插件（audio_service 等）字节码版本混用，只告警不报错
kotlin.jvm.target.validation.mode=warning
# 依赖缓存在 C 盘、工程在 E 盘，Kotlin 增量缓存无法跨盘相对化
kotlin.incremental=false

# 用 JDK 17 构建（Studio 自带的是 JDK 25，Gradle 8.x 不支持）
org.gradle.java.home=D:\\Jdk17
