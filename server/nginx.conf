server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;

    # APK 必须告诉客户端"支持断点续传"，否则 Android 侧一断网就从 0 重下。
    # 36MB 的包在家里 wifi 上断一次就要重来，这个头是刚需。
    add_header Accept-Ranges bytes always;

    # version.json 不允许任何缓存：CDN、运营商代理、手机浏览器都会缓存它，
    # 缓存住就会出现"服务器已发新版，App 永远提示已是最新"。
    location = /version.json {
        default_type application/json;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Accept-Ranges bytes always;
    }

    # nginx 自带的 mime.types 里没有 apk，不显式指定的话
    # 有的下载器会因为 Content-Type 不对而拒绝写文件
    location ~* \.apk$ {
        default_type application/vnd.android.package-archive;
        add_header Accept-Ranges bytes always;
        add_header Cache-Control "public, max-age=600" always;
    }

    location / {
        try_files $uri =404;
    }

    # 不列目录，避免路径被扫
    autoindex off;
}
