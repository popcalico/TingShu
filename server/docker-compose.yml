services:
  tingshu-update:
    image: nginx:1.27-alpine
    container_name: tingshu-update
    restart: unless-stopped
    # 只绑本机回环，外网必须经主机 nginx（走 443 + 泛域名证书）
    ports:
      - "127.0.0.1:8765:80"
    volumes:
      - ./www:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 96m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
