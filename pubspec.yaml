name: tingshu
description: "听评书：专为老人设计的评书播放器，只做一件事——点开就听。"
publish_to: 'none'
version: 1.1.27+31

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  # 网络
  dio: ^5.11.1
  crypto: ^3.0.7
  # WebDAV 的 PROPFIND 返回 207 XML，要解析
  xml: ^6.5.0

  # 本地存储
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6

  # 播放
  media_kit: ^1.2.6
  media_kit_libs_audio: ^1.0.7
  audio_service: ^0.18.19


  # 书架封面
  cached_network_image: ^3.4.1

  # 通知权限

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
